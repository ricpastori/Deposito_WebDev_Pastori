<!DOCTYPE html>
<!-- Dichiarazione DOCTYPE: specifica che è un documento HTML5 -->
<html lang="it">
<!-- Sezione head: contiene metadati, link al CSS e titolo della pagina -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description">
  <meta name="author" content="Riccardo Pastori">
  <!-- Link al foglio di stile CSS: collega style.css per applicare gli stili -->
  <link rel="stylesheet" href="style.css">
  <title>Esercitazione mattina - Giorno 3</title>
</head>
<!-- Sezione body: contenuto visibile della pagina; eredita font-family dal CSS applicato al body -->
<body>
  <!-- Container principale: div con id="container"; grazie al CSS (#container), è centrato, ha bordi e larghezza massima -->
  <div id="container">
    <!-- Titolo principale: h1; stilizzato con colore grigio e font Impact tramite CSS -->
    <h1>Giorno 3 - Esercitazione mattina</h1>
    <!-- Paragrafo: elemento p; applica margine inferiore, colore nero e line-height grazie al CSS (cascata sovrascrive il rosso iniziale) -->
    <p>In questa esercitazione, abbiamo creato una semplice pagina web utilizzando HTML e CSS. Abbiamo imparato a strutturare il contenuto con elementi semantici e a stilizzare la pagina con regole CSS.</p>
    <!-- Secondo paragrafo con link: il link <a> ha pseudo-classe :hover che cambia colore ad aqua nel CSS -->
    <p><a href="../Esempio/index.html">Qui</a> puoi vedere un altro esempio fatto questa mattina</p>
  </div>
</body>
</html>
