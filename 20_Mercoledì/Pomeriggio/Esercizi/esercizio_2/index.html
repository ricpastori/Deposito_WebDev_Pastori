<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Meta tag principali della pagina -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Esercizio JavaScript sul caricamento asincrono dei dati di un utente.">
  <meta name="author" content="Riccardo Pastori">
  <title>Caricamento dati utente</title>

  <!-- Collegamento al foglio di stile -->
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <!-- Contenuto principale dell'esercizio -->
  <main class="container">
    <h1>Caricamento dati utente</h1>

    <button id="load-btn" type="button">Carica utente</button>

    <!-- Area aggiornata dinamicamente tramite JavaScript -->
    <section id="output" class="output" aria-live="polite">
      Clicca sul bottone per caricare i dati.
    </section>
  </main>

  <!-- Modale per inserire i dati dell'utente -->
  <dialog id="user-modal" class="modal">
    <form id="user-form" class="modal-content">
      <h2 id="modal-title">Inserisci dati utente</h2>

      <label for="user-name">Nome</label>
      <input id="user-name" name="nome" type="text" placeholder="Mario Rossi" required>

      <label for="user-role">Ruolo</label>
      <input id="user-role" name="ruolo" type="text" placeholder="Sviluppatore" required>

      <label for="user-status">Stato</label>
      <input id="user-status" name="stato" type="text" placeholder="Online" required>

      <div class="modal-actions">
        <button id="close-modal" type="button" class="secondary-button">Annulla</button>
        <button type="submit">Conferma</button>
      </div>
    </form>
  </dialog>

  <!-- Collegamento allo script JavaScript -->
  <script src="./assets/script.js"></script>
</body>
</html>
