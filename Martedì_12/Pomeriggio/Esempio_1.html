<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esempio secondo giorno</title>
  <!-- 
    Il tag meta con name="description" fornisce una breve descrizione del contenuto della pagina.
    Questa descrizione è spesso utilizzata dai motori di ricerca per visualizzare un'anteprima della pagina nei risultati di ricerca.
  -->
  <meta name="description" content="Esempio di struttura HTML con commenti esplicativi per il secondo giorno di corso.">
  <!-- 
    Il tag meta con name="author" specifica l'autore del documento.
    In questo caso, "Nome Cognome" è un segnaposto che dovrebbe essere sostituito con il nome reale dell'autore della pagina.
  -->
  <meta name="author" content="Nome Cognome">
</head>
<body>
  <!--
    Il tag header è usato per definire l'intestazione di una pagina o di una sezione.
    Contiene elementi come titoli, navigazione e altri contenuti introduttivi.
  -->
  <header>
    <h1>Benvenuto al secondo giorno di corso!</h1>

    <!--
      Il tag nav è usato per definire una sezione di navigazione all'interno della pagina.
      Contiene link a altre pagine o sezioni del sito.
    -->
    <nav>
      <ul>
        <li><a href="../Mattina/Esercizio.html">Esercizio della mattina</a></li>
        <li><a href="../Mattina/Esempio.html">Esempio della mattina</a></li>
      </ul>
    </nav>
  </header>

  <!--
    Il tag main è usato per definire il contenuto principale di una pagina.
    Dovrebbe essere unico per ogni pagina e non dovrebbe essere usato all'interno di header, nav, aside o footer.
  -->
  <main>

    <!--
      Il tag section è usato per definire una sezione generica di un documento.
      Può essere usato per raggruppare contenuti tematicamente correlati.
    -->
    <section>
      <h2>Sezione principale</h2>
      <p>Contenuto della sezione principale.</p>
    </section>

    <!-- 
      Il tag article è usato per definire un contenuto indipendente e autonomo all'interno di un documento.
      Può essere usato per articoli di notizie, post di blog, commenti, ecc.
    -->
    <article>
      <h2>Articolo</h2>
      <p>Contenuto dell'articolo.</p>
      <!--
        Il tag table è usato per definire una tabella in HTML.
        Contiene elementi come thead, tbody, tr, th e td per strutturare i dati in righe e colonne.
        L'attributo border="1" è usato per aggiungere un bordo alla tabella, rendendo più visibili le celle.
      -->
      <table border="1">
        <!-- 
          Il tag thead è usato per raggruppare l'intestazione di una tabella.
          Contiene elementi tr e th per definire le righe e le celle dell'intestazione.
        -->
        <thead>
          <!-- 
            Il tag tr è usato per definire una riga in una tabella.
            Contiene elementi th o td per definire le celle della riga.
          -->
          <tr>
            <!-- 
              Il tag th è usato per definire una cella di intestazione in una tabella.
              Viene solitamente visualizzato in grassetto e centrato.
            -->
            <th>Colonna 1</th>
            <th>Colonna 2</th>
          </tr>
        </thead>
        <!-- 
          Il tag tbody è usato per raggruppare il corpo di una tabella.
          Contiene elementi tr e td per definire le righe e le celle del corpo della tabella.
        -->
        <tbody>
          <tr>
            <!-- 
              Il tag td è usato per definire una cella di dati in una tabella.
              Viene solitamente visualizzato come testo normale allineato a sinistra.
            -->
            <td>Dato 1</td>
            <td>Dato 2</td>
          </tr>
          <tr>
            <td>Dato 3</td>
            <td>Dato 4</td>
          </tr>
        </tbody>
      </table>
    </article>
  </main>

  <!--
    Il tag footer è usato per definire il piè di pagina di una pagina o di una sezione.
    Contiene informazioni come copyright, link a termini di servizio, contatti, ecc.
  -->
  <footer>
    <p>Copyright © 2026</p>
  </footer>
</body>
</html>
