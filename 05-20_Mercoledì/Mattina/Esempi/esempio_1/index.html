<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esempio DOM Manipulation by Mirko</title>
  <link rel="stylesheets" src="./assets/style.css">
</head>
<body>
  <h1 id="titolo">DOM Manipulation</h1>

    <p id="paragrafo">
        Questo è un paragrafo iniziale
    </p>



    <!-- INPUT -->
    <input type="text" id="inputNome" placeholder="Inserisci nome">

    <button type="button" id="btnSalva">
        Salva nome
    </button>

    <p id="saluto"></p>



    <!-- BOTTONI -->
    <button type="button" id="btnTitolo">
        Cambia titolo
    </button>

    <button type="button" id="btnColore">
        Cambia colore
    </button>

    <button type="button" id="btnNascondi">
        Nascondi / Mostra
    </button>

    <button type="button" id="btnAggiungi">
        Aggiungi elemento
    </button>

    <button type="button" id="btnElimina">
        Elimina ultimo elemento
    </button>



    <!-- LISTA -->
    <ul id="lista">
        <li>Elemento iniziale</li>
    </ul>
    
  <script src="./assets/script.js"></script>
</body>
</html>
