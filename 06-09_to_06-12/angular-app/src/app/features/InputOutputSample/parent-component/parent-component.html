<article>
  <div>
    <p>Parent counter: {{ counter }} </p>
  </div>
  <app-child-component [childCounter]="counter" (counterChange)="onCounterChanged($event)"></app-child-component>

  <p>Signal parent counter: {{counterSignal()}}</p>
  <app-child-component [childCounterSignal]="counterSignal()" (counterChangeSignal)="onCounterChangedSignal($event)"></app-child-component>
</article>
