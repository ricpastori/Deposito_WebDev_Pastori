<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esempio secondo giorno</title>
</head>
<body>
  <!--
        Tag per creare un campo di input di tipo select (menu a tendina).
        I tag option rappresentano le opzioni disponibili nel menu a tendina.
        L'attributo value specifica il valore che viene inviato al server quando l'opzione è selezionata.
      -->
      <label for="corso">Corso:</label>
      <select id="corso" name="corso">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
      </select><br>

      <p>Seleziona le tecnologie conosciute:</p>
      
      <!--
        Tag per creare un campo di input di tipo checkbox.
        I campi di input di tipo checkbox consentono agli utenti di selezionare una o più opzioni.
        L'attributo value specifica il valore che viene inviato al server quando la casella è selezionata.
      -->
      <input type="checkbox" id="html" name="tecnologie" value="html">
      <label for="html">HTML</label>

      <input type="checkbox" id="css" name="tecnologie" value="css">
      <label for="css">CSS</label>

      <input type="checkbox" id="js" name="tecnologie" value="js">
      <label for="js">JavaScript</label>
</body>
</html>
